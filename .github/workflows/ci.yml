name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: swift-format
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: SwiftLint (pinned)
        env:
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          curl -sSfL -o swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  swiftlint.zip" | shasum -a 256 -c -
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" --strict

  build-test:
    runs-on: macos-15
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app
        run: scripts/bundle.sh release
      - name: Check bundled Calendar, Reminders, microphone and Speech usage strings
        run: |
          for key in NSCalendarsFullAccessUsageDescription NSRemindersFullAccessUsageDescription NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription; do
            plutil -extract "$key" raw build/DailyWorkspace.app/Contents/Info.plist
          done
