name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app
        run: Scripts/bundle.sh release
      - name: Check Info.plist usage string is embedded in the app bundle
        run: plutil -extract NSCalendarsFullAccessUsageDescription raw build/DailyWorkspace.app/Contents/Info.plist
