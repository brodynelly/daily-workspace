# Semantic lint only. Layout (indentation, wrapping, commas, braces) belongs to swift-format (.swift-format).
included:
  - Sources
  - Tests
  - Package.swift
excluded:
  - .build
disabled_rules:
  - line_length
  - trailing_comma
  - opening_brace
  - vertical_parameter_alignment
  - vertical_parameter_alignment_on_call
  - statement_position
  - comma
  - colon
  - multiple_closures_with_trailing_closure
opt_in_rules:
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - unused_optional_binding
  - fatal_error_message
  - unavailable_function
identifier_name:
  min_length: 1
  excluded: [id, x, y]
type_name:
  min_length: 2
function_body_length:
  warning: 80
  error: 80
